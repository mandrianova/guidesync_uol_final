<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">GuideSync milestone-aligned project execution plan</title>
  <desc id="desc">A plan from May problem framing and MVP through the June preliminary report, July durable orchestration and evaluation design, August implementation freeze and evidence collection, and September report submission quality assurance.</desc>
  <defs>
    <style>
      .title{font:750 40px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#10273d;letter-spacing:-1.2px}
      .sub{font:400 19px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#506a79}
      .month{font:750 17px ui-monospace,"SFMono-Regular",Menlo,monospace;fill:#2f5f8c;letter-spacing:1px}
      .label{font:750 20px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#10273d}
      .note{font:400 15px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#506a79}
      .bar{font:700 15px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#fff}
      .gate{font:750 13px ui-monospace,"SFMono-Regular",Menlo,monospace;fill:#10273d;letter-spacing:.6px}
      .footer{font:600 14px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#506a79}
    </style>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10273d" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="780" fill="#f5f8f7"/>
  <rect x="0" y="0" width="9" height="780" fill="#2f5f8c"/>
  <text x="66" y="65" class="title">GuideSync delivery plan: evidence before presentation</text>
  <text x="66" y="101" class="sub">Major gates and work packages, aligned to the MVP, preliminary report, evaluation freeze, and submission target.</text>

  <rect x="410" y="142" width="1080" height="52" rx="10" fill="#e8eef6"/>
  <text x="520" y="175" class="month" text-anchor="middle">MAY</text>
  <text x="750" y="175" class="month" text-anchor="middle">JUNE</text>
  <text x="980" y="175" class="month" text-anchor="middle">JULY</text>
  <text x="1210" y="175" class="month" text-anchor="middle">AUGUST</text>
  <text x="1430" y="175" class="month" text-anchor="middle">SEPT</text>

  <g stroke="#d4e0de" stroke-width="1.5">
    <line x1="410" y1="194" x2="410" y2="664"/><line x1="635" y1="194" x2="635" y2="664"/>
    <line x1="865" y1="194" x2="865" y2="664"/><line x1="1095" y1="194" x2="1095" y2="664"/>
    <line x1="1325" y1="194" x2="1325" y2="664"/><line x1="1490" y1="194" x2="1490" y2="664"/>
  </g>

  <g>
    <rect x="45" y="218" width="1445" height="78" rx="10" fill="#fff"/>
    <text x="66" y="248" class="label">Problem + feasibility</text><text x="66" y="274" class="note">Choose GuideSync and prove the smallest reviewable artifact</text>
    <rect x="430" y="235" width="255" height="42" rx="18" fill="#0a7a72" filter="url(#shadow)"/>
    <text x="557" y="262" class="bar" text-anchor="middle">Research framing → MVP</text>

    <rect x="45" y="306" width="1445" height="78" rx="10" fill="#eef4f3"/>
    <text x="66" y="336" class="label">Preliminary-report gate</text><text x="66" y="362" class="note">Model roles, privacy rationale, prototype evidence, evaluation plan</text>
    <rect x="650" y="323" width="275" height="42" rx="18" fill="#6750a4" filter="url(#shadow)"/>
    <text x="787" y="350" class="bar" text-anchor="middle">Model strategy + midterm</text>

    <rect x="45" y="394" width="1445" height="78" rx="10" fill="#fff"/>
    <text x="66" y="424" class="label">Durable implementation</text><text x="66" y="450" class="note">Bounded work units, retrieval, UI evidence, failure recovery</text>
    <rect x="885" y="411" width="350" height="42" rx="18" fill="#2f5f8c" filter="url(#shadow)"/>
    <text x="1060" y="438" class="bar" text-anchor="middle">Build + real-project validation</text>

    <rect x="45" y="482" width="1445" height="78" rx="10" fill="#eef4f3"/>
    <text x="66" y="512" class="label">Evidence collection</text><text x="66" y="538" class="note">Frozen cases, ablations, model comparison, independent review</text>
    <rect x="930" y="499" width="450" height="42" rx="18" fill="#c97716" filter="url(#shadow)"/>
    <text x="1155" y="526" class="bar" text-anchor="middle">Evaluation design → evidence freeze</text>

    <rect x="45" y="570" width="1445" height="78" rx="10" fill="#fff"/>
    <text x="66" y="600" class="label">Final communication</text><text x="66" y="626" class="note">Narrated demo, conclusions, references, HTML/PDF and submission QA</text>
    <rect x="1190" y="587" width="270" height="42" rx="18" fill="#b33b54" filter="url(#shadow)"/>
    <text x="1325" y="614" class="bar" text-anchor="middle">Report + submission</text>
  </g>

  <g>
    <line x1="635" y1="202" x2="635" y2="664" stroke="#0a7a72" stroke-width="3" opacity=".22"/>
    <circle cx="635" cy="202" r="8" fill="#0a7a72"/>
    <text x="635" y="694" class="gate" text-anchor="middle">MVP GATE · 17 MAY</text>

    <line x1="865" y1="202" x2="865" y2="664" stroke="#6750a4" stroke-width="3" opacity=".22"/>
    <circle cx="865" cy="202" r="8" fill="#6750a4"/>
    <text x="865" y="716" class="gate" text-anchor="middle">MIDTERM · 29 JUN</text>

    <line x1="1260" y1="202" x2="1260" y2="664" stroke="#c97716" stroke-width="3" opacity=".22"/>
    <circle cx="1260" cy="202" r="8" fill="#c97716"/>
    <text x="1260" y="694" class="gate" text-anchor="middle">FEATURE FREEZE · 12 AUG</text>

    <line x1="1458" y1="202" x2="1458" y2="664" stroke="#b33b54" stroke-width="3" opacity=".22"/>
    <circle cx="1458" cy="202" r="8" fill="#b33b54"/>
    <text x="1458" y="716" class="gate" text-anchor="middle">TARGET · 7 SEP</text>
  </g>

  <text x="66" y="754" class="footer">Planned sequence: implementation baseline → matched evidence → conclusions → presentation QA. Dates mark gates, not a claim of daily execution precision.</text>
</svg>
