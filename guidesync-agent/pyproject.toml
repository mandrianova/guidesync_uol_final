[project]
name = "guidesync-agent"
version = "0.1.0"
description = "Pydantic AI and FastAPI prototype for evidence-based documentation maintenance."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "boto3>=1.40",
  "fastapi>=0.115",
  "markdown-it-py>=4.2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "openai>=2.41",
  "playwright>=1.50",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.10",
  "pydantic-ai>=1.0",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.50",
  "spacy>=3.8",
  "spacy-lookups-data>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic-local = [
  "sentence-transformers>=3.0",
]

[project.scripts]
guidesync-agent-api = "guidesync_agent.api:main"
guidesync-agent-run = "guidesync_agent.agent:main"
guidesync-agent-benchmark = "guidesync_agent.benchmarks:main"
guidesync-agent-model-smoke = "guidesync_agent.model_smoke:main"
guidesync-agent-cleanup-projects = "guidesync_agent.project_cleanup:main"
guidesync-agent-seed-google-models = "guidesync_agent.google_model_profiles:main"
guidesync-agent-worker = "guidesync_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidesync_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py314"
output-format = "concise"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # Pyflakes
  "W",      # pycodestyle warnings
  "C90",    # McCabe complexity
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "RUF",    # Ruff-specific rules
  "ASYNC",  # flake8-async
  "BLE",    # flake8-blind-except
  "A",      # flake8-builtins
  "C4",     # flake8-comprehensions
  "Q",      # flake8-quotes
  "ANN",    # flake8-annotations
  "PLR",    # Pylint refactoring rules
]
ignore = [
  "ANN204", # Missing return type annotation for __init__.
  "ANN401", # Any is intentional for external SDK hooks and dynamic provider objects.
  "ASYNC109", # Async timeout parameters are enforced by bounded runtime helpers.
  "PLR2004", # Magic-value comparisons are too noisy for tests and configuration checks.
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30
max-branches = 8
max-returns = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm: sends a real inference request to a configured local or remote language model",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.49",
]
