x-guidesync-runtime-environment: &guidesync-runtime-environment
  GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google-application-default-credentials.json}"
  GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
  GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-global}"
  GUIDESYNC_DATABASE_URL: postgresql+psycopg://guidesync:guidesync@db:5432/guidesync
  GUIDESYNC_S3_BUCKET: guidesync-reports
  GUIDESYNC_S3_ENDPOINT_URL: http://minio:9000
  GUIDESYNC_S3_PREFIX: reports
  AWS_ACCESS_KEY_ID: guidesync
  AWS_SECRET_ACCESS_KEY: guidesync-secret
  AWS_DEFAULT_REGION: us-east-1
  GUIDESYNC_AGENT_PROVIDER: "${GUIDESYNC_AGENT_PROVIDER:-pydantic_ai}"
  GUIDESYNC_MODEL_BUNDLE: "${GUIDESYNC_MODEL_BUNDLE:-local_open_source}"
  GUIDESYNC_MODEL_PROVIDER_FAMILY: "${GUIDESYNC_MODEL_PROVIDER_FAMILY:-open_source}"
  GUIDESYNC_AGENT_MODEL: "${GUIDESYNC_AGENT_MODEL:-openai-chat:google/gemma-4-31b-qat}"
  GUIDESYNC_AGENT_BASE_URL: "${GUIDESYNC_AGENT_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_AGENT_API_KEY_ENV: "${GUIDESYNC_AGENT_API_KEY_ENV:-}"
  GUIDESYNC_AGENT_TIMEOUT_SECONDS: "${GUIDESYNC_AGENT_TIMEOUT_SECONDS:-600}"
  GUIDESYNC_AGENT_THINKING: "${GUIDESYNC_AGENT_THINKING:-high}"
  GUIDESYNC_LLM_BASE_URL: "${GUIDESYNC_LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_PROJECT_PROFILE_AGENT_PROVIDER: "${GUIDESYNC_PROJECT_PROFILE_AGENT_PROVIDER:-pydantic_ai}"
  GUIDESYNC_PROJECT_PROFILE_AGENT_MODEL: "${GUIDESYNC_PROJECT_PROFILE_AGENT_MODEL:-openai-chat:google/gemma-4-31b-qat}"
  GUIDESYNC_PROJECT_PROFILE_AGENT_BASE_URL: "${GUIDESYNC_PROJECT_PROFILE_AGENT_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_PROJECT_PROFILE_AGENT_API_KEY_ENV: "${GUIDESYNC_PROJECT_PROFILE_AGENT_API_KEY_ENV:-}"
  GUIDESYNC_PROJECT_PROFILE_AGENT_TIMEOUT_SECONDS: "${GUIDESYNC_PROJECT_PROFILE_AGENT_TIMEOUT_SECONDS:-600}"
  GUIDESYNC_PROJECT_PROFILE_OUTPUT_DIR: "${GUIDESYNC_PROJECT_PROFILE_OUTPUT_DIR:-/app/logs/project-profiles}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_PROVIDER: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_PROVIDER:-pydantic_ai}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_MODEL: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_MODEL:-openai-chat:google/gemma-4-31b-qat}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_BASE_URL: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_API_KEY_ENV: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_API_KEY_ENV:-}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_TIMEOUT_SECONDS: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_TIMEOUT_SECONDS:-600}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_THINKING: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_THINKING:-false}"
  GUIDESYNC_CODE_CHANGE_ANALYSIS_MAX_OUTPUT_TOKENS: "${GUIDESYNC_CODE_CHANGE_ANALYSIS_MAX_OUTPUT_TOKENS:-4096}"
  GUIDESYNC_SCREENSHOT_VISION_PROVIDER: "${GUIDESYNC_SCREENSHOT_VISION_PROVIDER:-local_http}"
  GUIDESYNC_SCREENSHOT_VISION_MODEL: "${GUIDESYNC_SCREENSHOT_VISION_MODEL:-openai-chat:google/gemma-4-31b-qat}"
  GUIDESYNC_SCREENSHOT_VISION_BASE_URL: "${GUIDESYNC_SCREENSHOT_VISION_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_SCREENSHOT_VISION_API_KEY_ENV: "${GUIDESYNC_SCREENSHOT_VISION_API_KEY_ENV:-}"
  GUIDESYNC_SCREENSHOT_VISION_TIMEOUT_SECONDS: "${GUIDESYNC_SCREENSHOT_VISION_TIMEOUT_SECONDS:-600}"
  GUIDESYNC_SCREENSHOT_VISION_SUPPORTS_VISION: "${GUIDESYNC_SCREENSHOT_VISION_SUPPORTS_VISION:-true}"
  GUIDESYNC_SPACY_MODEL: "${GUIDESYNC_SPACY_MODEL:-en_core_web_sm}"
  GUIDESYNC_SEMANTIC_RANKER_MODE: "${GUIDESYNC_SEMANTIC_RANKER_MODE:-embedding_endpoint}"
  GUIDESYNC_EMBEDDING_BASE_URL: "${GUIDESYNC_EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}"
  GUIDESYNC_EMBEDDING_MODEL: "${GUIDESYNC_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}"
  GUIDESYNC_EMBEDDING_API_KEY: "${GUIDESYNC_EMBEDDING_API_KEY:-}"
  GUIDESYNC_AUTH_MODE: none
  GUIDESYNC_LOG_DIR: /app/logs
  GUIDESYNC_REPOSITORY_CACHE_DIR: /cache/repositories
  GUIDESYNC_REPOSITORY_SYNC_QUEUE_URL: http://sqs:4566/000000000000/guidesync-repository-sync
  GUIDESYNC_SQS_ENDPOINT_URL: http://sqs:4566
  GUIDESYNC_VIDEO_TTS_MODEL_DIR: /models/tts/kokoro-en-v0_19
  GUIDESYNC_VIDEO_TTS_MODEL_ID: kokoro-en-v0_19
  GUIDESYNC_VIDEO_TTS_VOICE: bm_lewis
  GUIDESYNC_VIDEO_TTS_VOICE_ID: "10"
  GUIDESYNC_VIDEO_TTS_SPEED: "1.0"
  GUIDESYNC_VIDEO_TTS_NUM_THREADS: "2"
  GUIDESYNC_VIDEO_RENDER_TIMEOUT_MS: "30000"
  GUIDESYNC_VIDEO_TTS_TIMEOUT_SECONDS: "240"
  GUIDESYNC_VIDEO_FFMPEG_TIMEOUT_SECONDS: "240"
  GUIDESYNC_VIDEO_MAX_DURATION_SECONDS: "180"

x-guidesync-runtime-volumes: &guidesync-runtime-volumes
  - ./src:/app/src
  - ./scripts:/app/scripts:ro
  - ./tests:/app/tests
  - ./fixtures:/app/fixtures
  - ./migrations:/app/migrations
  - ./alembic.ini:/app/alembic.ini
  - ./logs:/app/logs
  - ../../draft-report:/draft-report:ro
  - ../../../guidesync-repository-cache:/cache/repositories
  - guidesync-tts-models:/models/tts
  - type: bind
    source: "${GOOGLE_APPLICATION_CREDENTIALS_HOST:-${HOME}/.config/gcloud/application_default_credentials.json}"
    target: /run/secrets/google-application-default-credentials.json
    read_only: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guidesync
      POSTGRES_USER: guidesync
      POSTGRES_PASSWORD: guidesync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - guidesync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidesync -d guidesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guidesync
      MINIO_ROOT_PASSWORD: guidesync-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - guidesync-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guidesync guidesync-secret &&
      mc mb --ignore-existing local/guidesync-reports
      "

  sqs:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: localstack/localstack:3
    depends_on:
      sqs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      awslocal --endpoint-url=http://sqs:4566 sqs create-queue --queue-name guidesync-repository-sync
      "

  app:
    build:
      context: .
    command:
      - uv
      - run
      - --no-dev
      - uvicorn
      - guidesync_agent.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8770"
      - --reload
    environment:
      <<: *guidesync-runtime-environment
      GUIDESYNC_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    volumes: *guidesync-runtime-volumes
    ports:
      - "127.0.0.1:8770:8770"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      GUIDESYNC_DATABASE_URL: postgresql+psycopg://guidesync:guidesync@db:5432/guidesync
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google-application-default-credentials.json}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-global}"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - type: bind
        source: "${GOOGLE_APPLICATION_CREDENTIALS_HOST:-${HOME}/.config/gcloud/application_default_credentials.json}"
        target: /run/secrets/google-application-default-credentials.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "guidesync-agent-worker", "--interval", "5"]
    environment:
      <<: *guidesync-runtime-environment
    volumes: *guidesync-runtime-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully

  tts-model-download:
    profiles: ["video"]
    build:
      context: .
    command: ["uv", "run", "--no-dev", "guidesync-agent-download-tts-model"]
    environment:
      GUIDESYNC_VIDEO_TTS_MODEL_DIR: /models/tts/kokoro-en-v0_19
    volumes:
      - guidesync-tts-models:/models/tts

  frontend:
    image: node:22-bookworm-slim
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      GUIDESYNC_API_TARGET: http://app:8770
      GUIDESYNC_OPENAPI_URL: http://app:8770/openapi.json
    volumes:
      - ./frontend:/workspace/frontend
      - guidesync-frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      app:
        condition: service_started

volumes:
  guidesync-postgres-data:
  guidesync-minio-data:
  guidesync-frontend-node-modules:
  guidesync-tts-models:
