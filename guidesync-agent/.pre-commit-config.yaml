repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd project/guidesync-agent && uv run ruff check .'
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd project/guidesync-agent && uv run ruff format --check .'
        language: system
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: bash -c 'cd project/guidesync-agent && uv run ty check .'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd project/guidesync-agent && uv run pytest'
        language: system
        pass_filenames: false
