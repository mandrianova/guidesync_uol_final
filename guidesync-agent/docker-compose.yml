services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guidesync
      POSTGRES_USER: guidesync
      POSTGRES_PASSWORD: guidesync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - guidesync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidesync -d guidesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: guidesync
      MINIO_ROOT_PASSWORD: guidesync-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - guidesync-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guidesync guidesync-secret &&
      mc mb --ignore-existing local/guidesync-reports
      "

  app:
    build:
      context: .
    command: ["uv", "run", "--no-dev", "guidesync-agent-api", "--host", "0.0.0.0", "--port", "8770"]
    environment:
      GUIDESYNC_DATABASE_URL: postgresql+psycopg://guidesync:guidesync@db:5432/guidesync
      GUIDESYNC_ARTIFACT_STORAGE: s3
      GUIDESYNC_S3_BUCKET: guidesync-reports
      GUIDESYNC_S3_ENDPOINT_URL: http://minio:9000
      GUIDESYNC_S3_PREFIX: reports
      AWS_ACCESS_KEY_ID: guidesync
      AWS_SECRET_ACCESS_KEY: guidesync-secret
      AWS_DEFAULT_REGION: us-east-1
      GUIDESYNC_AGENT_PROVIDER: pydantic_ai
      GUIDESYNC_AGENT_MODEL: openai:google/gemma-4-31b-qat
      GUIDESYNC_AGENT_BASE_URL: http://host.docker.internal:1234/v1
      GUIDESYNC_AGENT_TIMEOUT_SECONDS: "300"
      GUIDESYNC_AUTH_MODE: none
      GUIDESYNC_LOG_DIR: /app/logs
      GUIDESYNC_REPOSITORY_CACHE_DIR: /app/var/repositories
    volumes:
      - ./logs:/app/logs
      - ./var:/app/var
    ports:
      - "127.0.0.1:8770:8770"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    environment:
      GUIDESYNC_DATABASE_URL: postgresql+psycopg://guidesync:guidesync@db:5432/guidesync
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
    command: ["uv", "run", "--no-dev", "guidesync-agent-worker", "--interval", "5"]
    environment:
      GUIDESYNC_DATABASE_URL: postgresql+psycopg://guidesync:guidesync@db:5432/guidesync
      GUIDESYNC_ARTIFACT_STORAGE: s3
      GUIDESYNC_S3_BUCKET: guidesync-reports
      GUIDESYNC_S3_ENDPOINT_URL: http://minio:9000
      GUIDESYNC_S3_PREFIX: reports
      AWS_ACCESS_KEY_ID: guidesync
      AWS_SECRET_ACCESS_KEY: guidesync-secret
      AWS_DEFAULT_REGION: us-east-1
      GUIDESYNC_AGENT_PROVIDER: pydantic_ai
      GUIDESYNC_AGENT_MODEL: openai:google/gemma-4-31b-qat
      GUIDESYNC_AGENT_BASE_URL: http://host.docker.internal:1234/v1
      GUIDESYNC_AGENT_TIMEOUT_SECONDS: "300"
      GUIDESYNC_AUTH_MODE: none
      GUIDESYNC_LOG_DIR: /app/logs
      GUIDESYNC_REPOSITORY_CACHE_DIR: /app/var/repositories
    volumes:
      - ./logs:/app/logs
      - ./var:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully

volumes:
  guidesync-postgres-data:
  guidesync-minio-data:
