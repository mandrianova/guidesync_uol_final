<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">GuideSync high-level system components</title>
  <desc id="desc">A reviewer uses the React web interface, which calls a FastAPI application. FastAPI and a durable worker share Postgres state. Repository synchronisation is queued through SQS. The worker accesses a bounded Git cache, configurable model endpoints, and MinIO report and media artifacts.</desc>
  <defs>
    <style>
      .title{font:750 43px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#10273d;letter-spacing:-1.2px}
      .sub{font:400 20px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#506a79}
      .eyebrow{font:750 14px ui-monospace,"SFMono-Regular",Menlo,monospace;fill:#0a7a72;letter-spacing:1.8px}
      .stage{font:750 26px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#10273d}
      .body{font:400 17px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#3f596c}
      .small{font:650 15px "Avenir Next","Segoe UI",Arial,sans-serif;fill:#506a79}
      .mono{font:700 15px ui-monospace,"SFMono-Regular",Menlo,monospace;fill:#6750a4}
      .card{stroke-width:2.2;rx:18;ry:18}
      .flow{fill:none;stroke:#2f5f8c;stroke-width:4;marker-end:url(#arrow)}
      .async{fill:none;stroke:#c97716;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#arrowGold)}
      .data{fill:none;stroke:#0a7a72;stroke-width:4;marker-end:url(#arrowTeal)}
      .both{fill:none;stroke:#0a7a72;stroke-width:4;marker-start:url(#arrowTealStart);marker-end:url(#arrowTeal)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#2f5f8c"/></marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#c97716"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#0a7a72"/></marker>
    <marker id="arrowTealStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12 0 L0 6 L12 12 z" fill="#0a7a72"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#10273d" flood-opacity=".10"/></filter>
  </defs>

  <rect width="1600" height="980" fill="#f5f8f7"/>
  <rect x="0" y="0" width="9" height="980" fill="#0a7a72"/>
  <text x="70" y="70" class="eyebrow">GUIDESYNC / DEPLOYABLE SYSTEM</text>
  <text x="70" y="122" class="title">Durable components around the model workflow</text>
  <text x="70" y="158" class="sub">Typed state, queued work, bounded evidence, and reviewed artifacts remain outside model context.</text>

  <rect x="70" y="225" width="300" height="150" class="card" fill="#ffffff" stroke="#c6d7d4" filter="url(#shadow)"/>
  <text x="98" y="265" class="eyebrow">HUMAN BOUNDARY</text>
  <text x="98" y="307" class="stage">Reviewer</text>
  <text x="98" y="337" class="body">configure · inspect · approve</text>

  <rect x="470" y="225" width="350" height="150" class="card" fill="#e8eef6" stroke="#4e78a4" filter="url(#shadow)"/>
  <text x="498" y="265" class="eyebrow">PRESENTATION</text>
  <text x="498" y="307" class="stage">React web UI</text>
  <text x="498" y="337" class="body">Mantine · Vite · generated SDK</text>

  <rect x="920" y="225" width="610" height="150" class="card" fill="#eaf3f1" stroke="#2d8078" filter="url(#shadow)"/>
  <text x="948" y="265" class="eyebrow">APPLICATION SERVICE</text>
  <text x="948" y="307" class="stage">FastAPI</text>
  <text x="948" y="337" class="body">routes → controllers → services → typed storage adapters</text>

  <path d="M370 300 H470" class="flow"/>
  <path d="M820 300 H920" class="flow"/>
  <text x="844" y="282" class="small">HTTP / OpenAPI</text>

  <rect x="70" y="470" width="350" height="170" class="card" fill="#fff4df" stroke="#c4872d" filter="url(#shadow)"/>
  <text x="98" y="510" class="eyebrow">QUEUE</text>
  <text x="98" y="553" class="stage">LocalStack SQS</text>
  <text x="98" y="584" class="body">repository synchronisation</text>
  <text x="98" y="612" class="body">clone and fetch work</text>

  <rect x="520" y="450" width="420" height="210" class="card" fill="#f0eafb" stroke="#8068b4" filter="url(#shadow)"/>
  <text x="548" y="492" class="eyebrow">DURABLE EXECUTION</text>
  <text x="548" y="535" class="stage">GuideSync worker</text>
  <text x="548" y="570" class="body">bounded agent and deterministic tasks</text>
  <text x="548" y="600" class="body">heartbeats · retries · cancellation</text>
  <text x="548" y="630" class="body">publication and media orchestration</text>

  <rect x="1040" y="470" width="490" height="170" class="card" fill="#eaf3f1" stroke="#2d8078" filter="url(#shadow)"/>
  <text x="1068" y="510" class="eyebrow">DURABLE STATE</text>
  <text x="1068" y="553" class="stage">Postgres + Alembic</text>
  <text x="1068" y="584" class="body">projects · profiles · runs · evidence</text>
  <text x="1068" y="612" class="body">typed publication and evaluation state</text>

  <path d="M1145 375 V422 H245 V470" class="async"/>
  <text x="640" y="413" class="small">enqueue repository work</text>
  <path d="M420 555 H520" class="async"/>
  <path d="M940 555 H1040" class="both"/>
  <path d="M1260 375 V470" class="both"/>

  <rect x="70" y="755" width="350" height="150" class="card" fill="#ffffff" stroke="#c6d7d4"/>
  <text x="98" y="795" class="eyebrow">BOUNDED SOURCE</text>
  <text x="98" y="837" class="stage">Git repository cache</text>
  <text x="98" y="868" class="body">frozen revisions · allowed paths</text>

  <rect x="520" y="735" width="420" height="190" class="card" fill="#fff4df" stroke="#c4872d"/>
  <text x="548" y="775" class="eyebrow">CONFIGURABLE AI RUNTIME</text>
  <text x="548" y="817" class="stage">Model profiles</text>
  <text x="548" y="850" class="body">local OpenAI-compatible or supported</text>
  <text x="548" y="878" class="body">hosted endpoints assigned by role</text>
  <text x="548" y="907" class="mono">model · endpoint · limits · credentials</text>

  <rect x="1040" y="755" width="490" height="150" class="card" fill="#e8eef6" stroke="#4e78a4"/>
  <text x="1068" y="795" class="eyebrow">ARTIFACT STORAGE</text>
  <text x="1068" y="837" class="stage">MinIO</text>
  <text x="1068" y="868" class="body">screenshots · reports · audio · video</text>

  <path d="M650 660 V700 H245 V755" class="data"/>
  <path d="M730 660 V735" class="data"/>
  <path d="M810 660 V700 H1285 V755" class="data"/>

  <text x="70" y="958" class="small">Solid blue: reviewer/API flow · dashed gold: queued work · teal: persisted evidence and runtime dependencies</text>
</svg>
