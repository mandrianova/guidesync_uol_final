[project]
name = "guidesync-agent"
version = "0.1.0"
description = "Pydantic AI and FastAPI prototype for evidence-based documentation maintenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18.4",
  "boto3>=1.40",
  "fastapi>=0.115",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.10",
  "pydantic-ai>=1.0",
  "sqlalchemy>=2.0.50",
  "spacy>=3.8",
  "spacy-lookups-data>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic-local = [
  "sentence-transformers>=3.0",
]

[project.scripts]
guidesync-agent-api = "guidesync_agent.api:main"
guidesync-agent-run = "guidesync_agent.agent:main"
guidesync-agent-benchmark = "guidesync_agent.benchmarks:main"
guidesync-agent-worker = "guidesync_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidesync_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = [
  "ANN401", # Any is intentional for external SDK hooks and dynamic provider objects.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.49",
]
